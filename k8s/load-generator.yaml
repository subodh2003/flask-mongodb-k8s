# Test-only (not part of the main deploy). Apply to simulate high traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 4
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - while true; do wget -q -O- http://flask-service:5000/ >/dev/null; wget -q -O- http://flask-service:5000/data >/dev/null; done
